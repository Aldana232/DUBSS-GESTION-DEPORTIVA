name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dubss
          POSTGRES_USER: dubss
          POSTGRES_PASSWORD: dubss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dubss -d dubss"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: dubss
      POSTGRES_USER: dubss
      POSTGRES_PASSWORD: dubss
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Las mismas versiones exactas que se despliegan (constraints.txt)
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt pyflakes pip-audit
      - run: pytest --cov=apps --cov-report=term -q
      - run: python manage.py makemigrations --check
      - run: python -m pyflakes apps
      # Vulnerabilidades conocidas en las dependencias de producción
      - run: pip-audit -r requirements.txt -c constraints.txt --no-deps
      # La configuración de producción arranca y pasa las comprobaciones de seguridad de Django
      - name: Comprobaciones de despliegue (producción)
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: dubss.ejemplo.bo
          DJANGO_SECRET_KEY: una-clave-de-prueba-larga-y-aleatoria-0123456789-abcdefghijklmnopqrstuvwxyz

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # Solo falla con vulnerabilidades críticas en producción (las de PostCSS dentro de Next son de compilación)
      - run: npm audit --omit=dev --audit-level=critical

  despliegue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de los scripts
        run: for f in deploy/scripts/*.sh deploy/backup/backup.sh backend/docker-entrypoint.sh; do bash -n "$f"; done
      - name: El compose de producción es válido
        working-directory: deploy
        run: |
          cp .env.production.example .env
          docker compose config -q
      - name: Las imágenes de producción compilan
        working-directory: deploy
        run: docker compose build
