# =============================================================================
# DUBSS — Stack de PRODUCCIÓN (archivo compose por defecto de esta carpeta: basta  cd deploy && docker compose up -d)
#
#   cd deploy && cp .env.production.example .env   (o:  ./scripts/generar-env.sh)
#   docker compose up -d --build
#
# Lo único expuesto a internet es Caddy (80/443). La base de datos, Redis, el backend, Celery y n8n quedan en la
# red interna de Docker. El navegador solo habla con Next.js (que reenvía a Django): la API de Django no es pública.
# =============================================================================
name: dubss

x-registro: &registro            # evita que los logs llenen el disco del servidor
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: dubss-backend:prod
  restart: unless-stopped
  logging: *registro
  env_file: .env
  environment: &entorno-backend
    DJANGO_SETTINGS_MODULE: config.settings.production
    REDIS_URL: redis://redis:6379/0
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DJANGO_ALLOWED_HOSTS: ${DOMINIO},backend,localhost,127.0.0.1
    CORS_ALLOWED_ORIGINS: ${ESQUEMA:-https}://${DOMINIO}
    CSRF_TRUSTED_ORIGINS: ${ESQUEMA:-https}://${DOMINIO}
    USAR_HTTPS: ${USAR_HTTPS:-true}
    NUM_PROXIES: "1"
  volumes:
    - media_data:/app/mediafiles
    - ml_models:/app/apps/ml/models_trained

services:
  # ─── Proxy con HTTPS automático (Let's Encrypt) ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *registro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${ESQUEMA:-https}://${DOMINIO}
      ADMIN_URL: ${ADMIN_URL:-admin/}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data                # certificados: no borrar (Let's Encrypt limita las emisiones)
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }

  # ─── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *registro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *registro
    # Es el «buzón» de las tareas en segundo plano: sin expulsar mensajes cuando se llena.
    command: redis-server --save "" --appendonly no --maxmemory 200mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Django (migra la base y reúne los estáticos al arrancar) ───────
  backend:
    <<: *backend
    environment:
      <<: *entorno-backend
      RUN_MIGRATIONS: "1"
    volumes:
      - media_data:/app/mediafiles
      - static_data:/app/staticfiles
      - ml_models:/app/apps/ml/models_trained
      - ./secrets:/app/secrets:ro           # JSON de Firebase (opcional)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s                      # la primera vez migra toda la base
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery_worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - media_data:/app/mediafiles
      - ml_models:/app/apps/ml/models_trained
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 8 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      backend: { condition: service_healthy }

  celery_beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes: []
    depends_on:
      backend: { condition: service_healthy }

  # ─── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: dubss-frontend:prod
    restart: unless-stopped
    logging: *registro
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
      # Cookies «Secure» solo viajan por https: en una prueba por http://localhost hay que apagarlas.
      COOKIE_SECURE: ${USAR_HTTPS:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend: { condition: service_healthy }

  # ─── n8n + WhatsApp (OPCIONAL: docker compose --profile n8n up -d) ──────────
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:${N8N_VERSION:-1.123.27}
    restart: unless-stopped
    logging: *registro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - n8n import:workflow --separate --input=/workflows ; n8n update:workflow --all --active=true ; exec n8n start
    ports:
      - "127.0.0.1:5678:5678"             # el editor SOLO se abre desde el propio servidor (túnel SSH)
    environment:
      TZ: America/La_Paz
      GENERIC_TIMEZONE: America/La_Paz
      N8N_HOST: ${DOMINIO}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${ESQUEMA:-https}
      WEBHOOK_URL: ${ESQUEMA:-https}://${DOMINIO}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_SECURE_COOKIE: ${USAR_HTTPS:-true}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DUBSS_SECRETO: ${N8N_SECRETO:-}
      DUBSS_API: http://backend:8000/api/v1
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_PLANTILLA: ${WHATSAPP_PLANTILLA:-dubss_aviso}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-https://graph.facebook.com/v21.0}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    depends_on:
      backend: { condition: service_healthy }

  # ─── Respaldo diario de la base de datos y de las subidas ───────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *registro
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HORA_RESPALDO: ${HORA_RESPALDO:-03:15}
      RETENCION_DIAS: ${RETENCION_DIAS:-14}
      TZ: America/La_Paz
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups_data:/backups
      - media_data:/media:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  postgres_data:
  static_data:
  media_data:
  ml_models:
  backups_data:
  n8n_data:
  caddy_data:
  caddy_config:
