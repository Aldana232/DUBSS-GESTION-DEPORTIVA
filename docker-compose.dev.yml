
# Extiende docker-compose.yml para desarrollo local con hot-reload
services:

  db:
    image: postgres:16-alpine
    container_name: dubss_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dubss_redis_dev
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker de Celery: ejecuta las tareas (recordatorios, pronóstico, reentrenamiento).
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_celery_worker_dev
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Beat de Celery: dispara las tareas según el calendario de settings (CELERY_BEAT_SCHEDULE).
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_celery_beat_dev
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_backend_dev
    restart: unless-stopped
    # runserver con auto-reload
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dubss_frontend_dev
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      # El servidor de Next llama a Django por la red de Docker (proxy de sesión)
      - API_INTERNAL_URL=http://backend:8000/api/v1
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data_dev:
