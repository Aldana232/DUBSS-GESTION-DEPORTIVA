
# Extiende docker-compose.yml para desarrollo local con hot-reload
services:

  db:
    image: postgres:16-alpine
    container_name: dubss_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dubss_redis_dev
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker de Celery: ejecuta las tareas (recordatorios, pronóstico, reentrenamiento).
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_celery_worker_dev
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Beat de Celery: dispara las tareas según el calendario de settings (CELERY_BEAT_SCHEDULE).
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_celery_beat_dev
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dubss_backend_dev
    restart: unless-stopped
    # runserver con auto-reload
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dubss_frontend_dev
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      # El servidor de Next llama a Django por la red de Docker (proxy de sesión)
      - API_INTERNAL_URL=http://backend:8000/api/v1
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    depends_on:
      - backend

  # n8n: automatiza los avisos por WhatsApp. OPCIONAL (perfil "n8n"):
  #   docker compose -f docker-compose.dev.yml --profile n8n up -d n8n      Editor: http://localhost:5678
  # Importa y activa los flujos de ./n8n/workflows al arrancar (el repositorio es la fuente de verdad).
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:1.123.27
    container_name: dubss_n8n_dev
    restart: unless-stopped
    # La imagen de n8n tiene su propio entrypoint: se reemplaza para poder importar los flujos antes de arrancar.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - n8n import:workflow --separate --input=/workflows ; n8n update:workflow --all --active=true ; exec n8n start
    ports:
      - "5678:5678"
    environment:
      - TZ=America/La_Paz
      - GENERIC_TIMEZONE=America/La_Paz
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Los flujos firman/verifican con crypto y leen estas variables con $env:
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - DUBSS_SECRETO=${N8N_SECRETO:-}
      - DUBSS_API=http://backend:8000/api/v1
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - WHATSAPP_PLANTILLA=${WHATSAPP_PLANTILLA:-dubss_aviso}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_API_BASE=${WHATSAPP_API_BASE:-https://graph.facebook.com/v21.0}
    volumes:
      - n8n_data_dev:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  postgres_data_dev:
  n8n_data_dev:
